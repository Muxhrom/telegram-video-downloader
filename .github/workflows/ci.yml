name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        shell: pwsh
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements-dev.txt
          python -m pip check

      - name: Privacy guard
        shell: pwsh
        run: ./scripts/check-privacy.ps1

      - name: Compile
        shell: pwsh
        run: python -m compileall -q telegram_video_downloader tests

      - name: Test
        shell: pwsh
        run: python -m pytest
